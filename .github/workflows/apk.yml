name: APK Android
# Construit l APK signé et le publie dans Releases (Grace Shop).

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Construire l'APK
        env:
          GS_KEYSTORE_B64: ${{ secrets.GS_KEYSTORE_B64 }}
          GS_STORE_PASS: ${{ secrets.GS_STORE_PASS }}
          GS_KEY_PASS: ${{ secrets.GS_STORE_PASS }}
          GS_KEY_ALIAS: graceshop
        run: |
          if [ -z "$GS_KEYSTORE_B64" ] || [ -z "$GS_STORE_PASS" ]; then
            echo "::error::Ajoutez les secrets GS_KEYSTORE_B64 et GS_STORE_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Longueur GS_KEYSTORE_B64 : $(printf '%s' "$GS_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | wc -c) (attendu 3560)"
          echo "Longueur GS_STORE_PASS : $(printf '%s' "$GS_STORE_PASS" | tr -d '[:space:]' | wc -c) (attendu 24)"
          printf '%s' "$GS_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/grace-shop.jks"
          export GS_STORE_PASS="$(printf '%s' "$GS_STORE_PASS" | tr -d '[:space:]')"
          export GS_KEY_PASS="$GS_STORE_PASS"
          echo "Taille de la clé : $(wc -c < "$RUNNER_TEMP/grace-shop.jks") octets (attendu : 2670)"
          export GS_KEYSTORE="$RUNNER_TEMP/grace-shop.jks"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk grace-shop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: grace-shop-apk
          path: grace-shop.apk
      - name: Publier sur la page Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Grace Shop Android ${{ github.run_number }}
          make_latest: true
          files: grace-shop.apk
          body: |
            Application Android Grace Shop.
            Lien direct toujours à jour : https://github.com/grace-shop/grace-shop.github.io/releases/latest/download/grace-shop.apk
