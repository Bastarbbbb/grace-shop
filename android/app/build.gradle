plugins { id 'com.android.application' }

def vCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'tg.graceshop.app'
    compileSdk 34
    defaultConfig {
        applicationId "tg.graceshop.app"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0." + vCode
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("GS_KEYSTORE") ?: "none.jks")
            storePassword System.getenv("GS_STORE_PASS")
            keyAlias System.getenv("GS_KEY_ALIAS")
            keyPassword System.getenv("GS_KEY_PASS")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
